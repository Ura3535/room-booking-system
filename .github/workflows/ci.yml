name: CI Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore RoomBooking.sln

      - name: Build solution
        run: dotnet build RoomBooking.sln --no-restore --configuration Release

      - name: Run unit tests
        run: dotnet test RoomBooking.sln --no-build --configuration Release --verbosity normal
